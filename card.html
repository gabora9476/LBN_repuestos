<meta property="og:title" content="LBN Inversiones C.A.">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --pur:#c822ff; --pur2:#8b1fc0; --pur3:#5c1a80;
        --dark:#0a0a0a; --card:#131313; --wh:#f0f0f0; --accent:#e040fb; --green:#1BA755;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--wh);overflow-x:hidden}

    /* ═══════════════════════════════════════
       FONDO AMBIENTAL (idéntico al catálogo)
       ═══════════════════════════════════════ */
    #bgWrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    #bgWrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(200,34,255,.14) 0%, transparent 60%);z-index:1}
    #bgWrap img{width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.12) saturate(.5);transform:scale(1.1);animation:panBg 30s infinite alternate ease-in-out}
    @keyframes panBg{0%{transform:scale(1.1) translate(0,0)}100%{transform:scale(1.2) translate(-2%,-2%)}}

    /* ═══════════════════════════════════════
       TOAST
       ═══════════════════════════════════════ */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,10,30,.97);color:#fff;border:1px solid rgba(200,34,255,.3);padding:12px 24px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(200,34,255,.2);backdrop-filter:blur(10px)}
    .toast.show{opacity:1}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .card-wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:8px}

    /* ═══════════════════════════════════════
       BANNER
       ═══════════════════════════════════════ */
    .banner{position:relative;height:175px;margin:18px 18px 0;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,var(--pur3) 0%,var(--pur2) 45%,var(--pur) 78%,var(--accent) 100%);box-shadow:0 14px 40px rgba(200,34,255,.35);animation:fadeUp .6s cubic-bezier(.4,0,.2,1) both}
    .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;mix-blend-mode:overlay;filter:saturate(.5)}
    .banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 28% 18%, rgba(255,255,255,.22), transparent 55%)}

    /* ═══════════════════════════════════════
       AVATAR / LOGO
       ═══════════════════════════════════════ */
    .avatar-wrap{width:112px;height:112px;border-radius:50%;margin:-56px auto 0;position:relative;z-index:2;background:var(--dark);border:4px solid var(--dark);box-shadow:0 0 0 2px rgba(200,34,255,.55),0 10px 30px rgba(0,0,0,.5);overflow:hidden;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .1s both}
    .avatar-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;background:var(--card);display:block}
    .avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card)}
    .avatar-fallback span{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#8b1fc0,#c822ff,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    /* ═══════════════════════════════════════
       NOMBRE / TAGLINE
       ═══════════════════════════════════════ */
    .brand-name{font-family:'Barlow Condensed',sans-serif;font-size:29px;font-weight:900;letter-spacing:1.5px;text-align:center;margin-top:16px;padding:0 20px;background:linear-gradient(90deg,#8b1fc0,#c822ff,#e040fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .18s both}
    .brand-tag{text-align:center;color:#9a9a9a;font-size:13.5px;margin-top:6px;font-weight:500;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .24s both}
    .brand-loc{display:flex;align-items:center;justify-content:center;gap:5px;color:#666;font-size:11.5px;margin-top:8px;letter-spacing:.3px;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .3s both}
    .brand-loc svg{width:13px;height:13px;flex-shrink:0}

    /* ═══════════════════════════════════════
       ACCIONES RÁPIDAS (Llamar / Guardar)
       ═══════════════════════════════════════ */
    .qa-row{display:flex;gap:10px;padding:22px 18px 0;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .36s both}
    .qa-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px 8px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid rgba(200,34,255,.22);backdrop-filter:blur(14px);text-decoration:none;color:var(--wh);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:.22s;overflow:visible;-webkit-appearance:none;appearance:none}
    .qa-btn:active{transform:scale(.96);background:rgba(200,34,255,.14)}
    .qa-btn:focus-visible{outline:2px solid var(--pur);outline-offset:3px}
    .qa-icon{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pur2),var(--pur));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(200,34,255,.4);flex-shrink:0}
    .qa-icon svg{width:18px;height:18px}

    /* True Focus — efecto sobre la palabra "Llamar"
       (inspirado en reactbits.dev/text-animations/true-focus,
       recreado en CSS puro: blur→foco + marco de esquinas con glow) */
    .true-focus{position:relative;display:inline-block;padding:2px 5px;overflow:visible}
    .tf-word{display:inline-block;animation:tfWordIn .7s cubic-bezier(.4,0,.2,1) .5s both}
    .tf-frame{position:absolute;inset:-9px -7px;pointer-events:none}
    .tf-corner{position:absolute;width:11px;height:11px}
    .tf-tl{top:0;left:0;border-top:2px solid var(--pur);border-left:2px solid var(--pur);border-top-left-radius:3px;animation:tfCornerTL .7s cubic-bezier(.4,0,.2,1) .5s both,tfGlow 2.6s ease-in-out 1.3s infinite}
    .tf-tr{top:0;right:0;border-top:2px solid var(--pur);border-right:2px solid var(--pur);border-top-right-radius:3px;animation:tfCornerTR .7s cubic-bezier(.4,0,.2,1) .5s both,tfGlow 2.6s ease-in-out 1.3s infinite}
    .tf-bl{bottom:0;left:0;border-bottom:2px solid var(--pur);border-left:2px solid var(--pur);border-bottom-left-radius:3px;animation:tfCornerBL .7s cubic-bezier(.4,0,.2,1) .5s both,tfGlow 2.6s ease-in-out 1.3s infinite}
    .tf-br{bottom:0;right:0;border-bottom:2px solid var(--pur);border-right:2px solid var(--pur);border-bottom-right-radius:3px;animation:tfCornerBR .7s cubic-bezier(.4,0,.2,1) .5s both,tfGlow 2.6s ease-in-out 1.3s infinite}
    @keyframes tfWordIn{from{filter:blur(6px);opacity:.5}to{filter:blur(0);opacity:1}}
    @keyframes tfCornerTL{from{opacity:0;transform:translate(7px,7px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes tfCornerTR{from{opacity:0;transform:translate(-7px,7px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes tfCornerBL{from{opacity:0;transform:translate(7px,-7px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes tfCornerBR{from{opacity:0;transform:translate(-7px,-7px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes tfGlow{0%,100%{filter:drop-shadow(0 0 2px rgba(200,34,255,.55))}50%{filter:drop-shadow(0 0 7px rgba(200,34,255,1)) drop-shadow(0 0 14px rgba(200,34,255,.5))}}
    .qa-btn:hover .tf-corner,.qa-btn:focus-visible .tf-corner{filter:drop-shadow(0 0 9px rgba(200,34,255,1))}

    /* ═══════════════════════════════════════
       CTA PRINCIPAL — CATÁLOGO
       ═══════════════════════════════════════ */
    .cat-main{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 18px 0;padding:20px;border-radius:20px;background:linear-gradient(90deg,var(--pur2),var(--pur),var(--accent));color:#fff;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:800;letter-spacing:2.5px;box-shadow:0 10px 34px rgba(200,34,255,.45);transition:.2s;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .42s both}
    .cat-main:active{transform:scale(.97)}
    .cat-main:focus-visible{outline:2px solid #fff;outline-offset:3px}
    .cat-main svg{width:23px;height:23px;flex-shrink:0}

    /* ═══════════════════════════════════════
       REDES SOCIALES (mismo patrón s-chip del catálogo)
       ═══════════════════════════════════════ */
    .link-stack{display:flex;flex-direction:column;gap:10px;margin:22px 18px 0;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .48s both}
    .s-chip{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid #222;border-radius:14px;padding:15px;text-decoration:none;transition:.2s}
    .s-chip:active{transform:scale(.97)}
    .s-chip:focus-visible{outline:2px solid var(--pur);outline-offset:2px}
    .s-chip-info{display:flex;flex-direction:column;gap:2px}
    .s-chip-net{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700}
    .s-chip-handle{font-size:14px;color:var(--wh);font-weight:500}
    .s-chip-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .s-chip-icon.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
    .s-chip-icon.tt{background:#010101}
    .s-chip-icon.wa{background:linear-gradient(135deg,#075e54,#25d366)}
    .s-chip-icon.fb{background:linear-gradient(135deg,#0064e0,#1877f2)}
    .s-chip-icon svg{width:22px;height:22px}

    /* ═══════════════════════════════════════
       PIE DE PÁGINA
       ═══════════════════════════════════════ */
    footer{text-align:center;padding:28px 24px 36px;color:#555;font-size:11px;line-height:1.8;animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .54s both}
    footer a{color:var(--pur);text-decoration:none}

    @media (max-width:380px){
        .brand-name{font-size:25px}
        .cat-main{font-size:20px;letter-spacing:1.5px}
        .qa-btn{font-size:12px}
    }
    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
        #bgWrap img{animation:none}
    }
</style>
</head>

<script>
function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
}

function saveContact(){
    const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:LBN Inversiones C.A.',
        'ORG:LBN Inversiones C.A.',
        'TEL;TYPE=CELL,VOICE:+584241754818',
        'URL:https://wa.me/584241754818',
        'NOTE:Repuestos, Aceites y Lubricantes - Venezuela',
        'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcard], {type:'text/vcard;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'LBN-Inversiones.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('Contacto guardado ✓');
}
</script>
